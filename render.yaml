# Render Blueprint: creates the database, the API and the website in one go.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: primehr-db
    plan: free
    databaseName: primehr
    user: primehr

services:
  # Express API
  - type: web
    name: primehr-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # db:setup is safe to re-run: it creates missing tables and the demo accounts
    startCommand: npm run db:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primehr-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # the website's URL, e.g. https://primehr-web.onrender.com
      - key: GROQ_API_KEY
        sync: false # optional; leave empty to turn the AI assistant off

  # Next.js website
  - type: web
    name: primehr-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # the API's URL + /api, e.g. https://primehr-api.onrender.com/api
